name: Alpine APK Build

on:
  push:
    branches:
      - apk
  pull_request:
    branches:
      - apk
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target architecture'
        required: false
        default: 'x86_64'
      sdk_version:
        description: 'OpenWrt SDK version'
        required: false
        default: '25.12'
      sdk_target:
        description: 'SDK target architecture'
        required: false
        default: 'x86_64'

env:
  PACKAGE_NAME: luci-app-xray
  CACHE_DIR: ~/cache
  SDK_HOME: ~/openwrt-sdk

jobs:
  build:
    name: Build Alpine APK
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: x86_64
            arch: x86_64
            sdk_url_path: https://downloads.openwrt.org/releases/25.12.2/targets/x86/64
            sdk_name: -sdk-25.12.2-x86-64_
            feeds_target: alpine_3.19
          - id: armv8
            arch: armv8
            sdk_url_path: https://downloads.openwrt.org/releases/25.12.2/targets/arm/cortex-a53
            sdk_name: -sdk-25.12.2-arm-cortexa53_
            feeds_target: alpine_3.19

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Cache Key
        id: cache_key
        run: |
          echo "timestamp=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Setup Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CACHE_DIR }}
            ${{ env.SDK_HOME }}
          key: alpine-${{ matrix.arch }}-${{ matrix.id }}-${{ env.PACKAGE_NAME }}-${{ steps.cache_key.outputs.timestamp }}
          restore-keys: |
            alpine-${{ matrix.arch }}-${{ matrix.id }}-${{ env.PACKAGE_NAME }}-

      - name: Install Dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
            ccache \
            gettext \
            libncurses5-dev \
            xsltproc \
            zstd \
            tar \
            wget \
            curl \
            unzip \
            file

      - name: Create Directories
        run: |
          CACHE_DIR_SDK="${{ env.CACHE_DIR }}/sdk"
          CACHE_DIR_DL="${{ env.CACHE_DIR }}/dl"
          CACHE_DIR_FEEDS="${{ env.CACHE_DIR }}/feeds"
          
          echo "CACHE_DIR_SDK: $CACHE_DIR_SDK"
          echo "CACHE_DIR_DL: $CACHE_DIR_DL"
          echo "CACHE_DIR_FEEDS: $CACHE_DIR_FEEDS"
          
          test -d "$CACHE_DIR_SDK" || mkdir -p "$CACHE_DIR_SDK"
          test -d "$CACHE_DIR_DL" || mkdir -p "$CACHE_DIR_DL"
          test -d "$CACHE_DIR_FEEDS" || mkdir -p "$CACHE_DIR_FEEDS"
          
          echo "CACHE_DIR_SDK=$CACHE_DIR_SDK" >> $GITHUB_ENV
          echo "CACHE_DIR_DL=$CACHE_DIR_DL" >> $GITHUB_ENV
          echo "CACHE_DIR_FEEDS=$CACHE_DIR_FEEDS" >> $GITHUB_ENV

      - name: Download and Unzip SDK
        run: |
          cd "$CACHE_DIR_SDK"
          
          # SDK filename (without version for flexibility)
          SDK_FILE="${{ matrix.sdk_name }}${{ matrix.arch }}"
          
          # Check if SDK already exists
          if [ ! -f "$SDK_FILE" ]; then
            echo "Downloading SDK..."
            wget -q --show-progress -O "$SDK_FILE" "${{ matrix.sdk_url_path }}/$SDK_FILE"
          fi
          
          # List the downloaded file
          file "$SDK_FILE"
          
          # Extract SDK to a new location
          SDK_EXTRACT_DIR=$(mktemp -d)/openwrt
          tar -C "$SDK_EXTRACT_DIR" --strip=1 -xf "$SDK_FILE"
          
          # Set up symlinks for feeds and downloads
          SDK_EXTRACT_DIR="$(eval echo "$SDK_EXTRACT_DIR")"
          test -d "$SDK_EXTRACT_DIR/dl" && rm -rf "$SDK_EXTRACT_DIR/dl" || true
          test -d "$SDK_EXTRACT_DIR/feeds" && rm -rf "$SDK_EXTRACT_DIR/feeds" || true
          
          ln -s "$CACHE_DIR_DL" "$SDK_EXTRACT_DIR/dl"
          ln -s "$CACHE_DIR_FEEDS" "$SDK_EXTRACT_DIR/feeds"
          
          echo "SDK_EXTRACT_DIR=$SDK_EXTRACT_DIR" >> $GITHUB_ENV

      - name: Setup Feeds
        run: |
          cd "$SDK_EXTRACT_DIR"
          
          # Create a feeds.conf for Alpine
          cat > feeds.conf << EOF
          src-git full https://github.com/openwrt/openwrt.git
          src-git packages https://github.com/openwrt/packages.git
          src-git luci https://github.com/openwrt/luci.git
          src-git telephony https://github.com/openwrt/telephony.git
          EOF
          
          echo "feeds.conf created"
          cat feeds.conf

      - name: Update and Install Packages
        run: |
          cd "$SDK_EXTRACT_DIR"
          
          # Update all feeds
          ./scripts/feeds update -a
          
          # Install all feeds
          ./scripts/feeds install -a
          
          # Show installed packages
          ./scripts/feeds list | grep -E "(luci|packages|full)" || true

      - name: Configure for Alpine
        run: |
          cd "$SDK_EXTRACT_DIR"
          
          # Copy .config from base SDK
          if [ -f .config ]; then
            cp .config .config.base
          fi
          
          # Create Alpine-specific config
          cat > .config << EOF
          # Configuration for Alpine
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_TARGET_ROOTFS_DATA_SIZE_64M=y
          CONFIG_TARGET_ROOTFS_SQUASHFS_SIZE_64M=y
          CONFIG_TARGET_ROOTFS_SIZE_64M=y
          CONFIG_TARGET_ALPINE=y
          CONFIG_TARGET_ALPINE_ROOTFS_SIZE_64M=y
          CONFIG_TARGET_ALPINE_FEEDS=y
          CONFIG_TARGET_ALPINE_PACKAGES=y
          CONFIG_TARGET_ALPINE_LUCI=y
          CONFIG_TARGET_ALPINE_TELEPHONY=y
          CONFIG_TARGET_ALPINE_FEEDS_CONF=y
          
          # Select feeds target
          CONFIG_FEEDS_TARGET_${{ matrix.feeds_target }}=y
          
          # Basic build options
          CONFIG_PACKAGE_BUSYBOX=y
          CONFIG_PACKAGE_BUSYBOX_SHOW_WAIT=y
          CONFIG_PACKAGE_OPKG=y
          CONFIG_PACKAGE_DASH=y
          CONFIG_TARGET_ROOTFS=y
          EOF
          
          echo ".config configured for Alpine"

      - name: Build Packages
        run: |
          cd "$SDK_EXTRACT_DIR"
          
          # Clean previous build if exists
          make package/${{ env.PACKAGE_NAME }}/status/{clean,compile} V=s || true
          
          # Compile just our package
          make package/${{ env.PACKAGE_NAME }}/compile/${{ env.PACKAGE_NAME }} V=s || true
          
          # List built files
          echo "=== Built files in bin/ ==="
          find "$SDK_EXTRACT_DIR/bin/" -type f \( -name "*.ipk" -o -name "*.apk" \) -exec ls -lh {} \; || true

      - name: Copy Artifacts
        run: |
          cd "$SDK_EXTRACT_DIR"
          
          # Copy the main binary
          BINARY_NAME="${{ env.PACKAGE_NAME }}"
          
          if [ -f "$SDK_EXTRACT_DIR/bin/${BINARY_NAME}" ]; then
            cp "$SDK_EXTRACT_DIR/bin/${BINARY_NAME}" "${{ github.workspace }}/${BINARY_NAME}"
            echo "Built binary: $BINARY_NAME"
          fi
          
          # Copy the .apk if it exists
          APK_NAME="${{ env.PACKAGE_NAME }}.apk"
          
          if [ -f "$SDK_EXTRACT_DIR/bin/${APK_NAME}" ]; then
            cp "$SDK_EXTRACT_DIR/bin/${APK_NAME}" "${{ github.workspace }}/${APK_NAME}"
            echo "Built APK: $APK_NAME"
          fi
          
          # List all artifacts
          echo "=== Artifact List ==="
          find "${{ github.workspace }}" -maxdepth 1 -type f \( -name "*.ipk" -o -name "*.apk" \) -exec ls -lh {} \; || true

      - name: Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.ipk
            *.apk
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Release Publish
        uses: peter-evans/notify-build-status@v2
        if: github.event_name == 'workflow_dispatch'
        with:
          url: ${{ secrets.TRIGGER_URL }}
          token: ${{ secrets.TRIGGER_TOKEN }}
          event: release
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
