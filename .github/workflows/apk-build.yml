name: Build Alpine (apk) Packages

on:
  push:
    branches:
      - apk
  pull_request:
    branches:
      - apk
  workflow_dispatch:

env:
  PACKAGE_NAME: luci-app-xray
  CACHE_DIR: ${{ github.workspace }}/.cache

jobs:
  build:
    name: apk ${{ matrix.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: x86_64
            sdk_url_path: https://downloads.openwrt.org/releases/25.12.2/targets/x86/64
            sdk_name: openwrt-sdk-25.12.2-x86-64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CACHE_DIR }}
          key: alpine-sdk-${{ matrix.sdk_name }}-${{ env.PACKAGE_NAME }}
          restore-keys: |
            alpine-sdk-${{ matrix.sdk_name }}-

      - name: Install Dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
            ccache gettext libncurses5-dev xsltproc zstd tar wget curl file

      - name: Prepare Cache Directories
        run: |
          mkdir -p "$CACHE_DIR/sdk" "$CACHE_DIR/dl" "$CACHE_DIR/feeds"
          echo "SDK_HOME=$(mktemp -d)/openwrt" >> "$GITHUB_ENV"

      - name: Download and Extract SDK
        run: |
          cd "$CACHE_DIR/sdk"
          # Fetch the published checksum list and locate our SDK file
          wget -q -O sha256sums.all "${{ matrix.sdk_url_path }}/sha256sums"
          grep -m1 "${{ matrix.sdk_name }}" sha256sums.all > sha256sums.small || {
            echo "::error::SDK ${{ matrix.sdk_name }} not found in ${{ matrix.sdk_url_path }}/sha256sums"
            exit 1
          }
          SDK_FILE="$(cut -d' ' -f2 sha256sums.small | sed 's/*//g')"
          if [ ! -f "$SDK_FILE" ]; then
            wget -q --show-progress -O "$SDK_FILE" "${{ matrix.sdk_url_path }}/$SDK_FILE"
          fi
          if ! sha256sum --check sha256sums.small >/dev/null 2>&1; then
            echo "::error::SDK checksum verification failed!"
            exit 1
          fi
          # Extract to a fresh directory, symlink shared caches
          rm -rf "$SDK_HOME"
          mkdir -p "$SDK_HOME"
          tar -C "$SDK_HOME" --strip=1 -xf "$CACHE_DIR/sdk/$SDK_FILE"
          rm -rf "$SDK_HOME/dl" "$SDK_HOME/feeds"
          ln -s "$CACHE_DIR/dl" "$SDK_HOME/dl"
          ln -s "$CACHE_DIR/feeds" "$SDK_HOME/feeds"
          echo "SDK_HOME=$SDK_HOME" >> "$GITHUB_ENV"

      - name: Configure Feeds
        run: |
          cd "$SDK_HOME"
          # Use GitHub mirrors for the OpenWrt core feeds
          cp feeds.conf.default feeds.conf
          sed -i 's#git.openwrt.org/openwrt/openwrt#github.com/openwrt/openwrt#' feeds.conf
          sed -i 's#git.openwrt.org/feed/packages#github.com/openwrt/packages#' feeds.conf
          sed -i 's#git.openwrt.org/project/luci#github.com/openwrt/luci#' feeds.conf
          sed -i 's#git.openwrt.org/feed/telephony#github.com/openwrt/telephony#' feeds.conf
          ./scripts/feeds update -a
          # Make this package part of the feed tree so package/Makefile lists it
          ln -sfn "${GITHUB_WORKSPACE}" "package/$(basename "${GITHUB_WORKSPACE}")"
          ./scripts/feeds install -a

      - name: Compile Packages
        run: |
          cd "$SDK_HOME"
          make defconfig
          # Packages live in subdirs (core, geodata, status), each with its own Makefile
          make package/${PACKAGE_NAME}/core/compile V=s -j"$(nproc)"
          make package/${PACKAGE_NAME}/geodata/compile V=s -j"$(nproc)"
          make package/${PACKAGE_NAME}/status/compile V=s -j"$(nproc)"
          find "$SDK_HOME/bin" -type f -name "*.apk" -exec ls -lh {} \;

      - name: Collect Artifacts
        run: |
          find "$SDK_HOME/bin" -type f -name "${PACKAGE_NAME}*.apk" | while read -r f; do
            base="$(basename "$f")"
            cp "$f" "${GITHUB_WORKSPACE}/${base%.*}-${{ matrix.id }}.${base##*.}"
          done
          ls -lh "${GITHUB_WORKSPACE}"/*.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${PACKAGE_NAME}-${{ matrix.id }}
          path: |
            ${GITHUB_WORKSPACE}/*.apk
          if-no-files-found: error

      - name: Publish Release
        if: github.event == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.sha }}
          files: |
            *.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
