name: Token Probe (temporary)

on: workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Show which token wins
        run: |
          T="$GITH"
          case "$T" in
            ghs_*) echo "GITHUB_TOKEN env = AUTOMATIC token (ghs_*)" ;;
            github_pat_*) echo "GITHUB_TOKEN env = user secret (fine-grained PAT)" ;;
            ghp_*) echo "GITHUB_TOKEN env = user secret (classic PAT)" ;;
            *) echo "GITHUB_TOKEN env = other (${T:0:5}***)" ;;
          esac
